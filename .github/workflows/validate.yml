name: Validate site

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:a11y
      - run: npm run test:site
